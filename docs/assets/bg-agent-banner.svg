<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">BG-Agent — Train. Evaluate. Share.</title>
  <desc id="desc">Open Battlegrounds AI research. Pinned rules, local PPO training, and community experiments. Research preview without pretrained strong weights.</desc>
  <defs>
